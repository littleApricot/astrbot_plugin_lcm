<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCM · 上下文与历史</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
:root{color-scheme:light;--bg:#f6f7fa;--panel:#fff;--ink:#253147;--muted:#7b8596;--line:#e7eaf0;--accent:#5368d5;--soft:#eef1ff;--shadow:0 10px 45px #26355b08;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#141820;--panel:#1c222d;--ink:#dce3f1;--muted:#8995ab;--line:#2c3545;--accent:#a3b0ff;--soft:#29324b;--shadow:0 10px 45px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px}button:hover{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.45;cursor:default}input,select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;min-width:0}input:focus,select:focus{outline:2px solid var(--soft);border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent)}[hidden]{display:none!important}
.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:23px;letter-spacing:1px;font-weight:750;display:flex;gap:10px;align-items:center}.logo{background:var(--soft);color:var(--accent);border-radius:12px;padding:0 10px}.sub{color:var(--muted);font-size:12px}.sidebar .sub{margin:4px 0 28px}.section-label{font-size:11px;font-weight:650;letter-spacing:1.8px;color:var(--muted);margin-bottom:12px}.session{border:0;text-align:left;width:100%;margin-bottom:7px;padding:12px;border-radius:10px;background:transparent;word-break:break-all}.session strong{display:block;font-size:13px}.session small{display:block;color:var(--muted);font-size:11px}.session.active{background:var(--soft);color:var(--accent)}.sidebar-bottom{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}
main{min-width:0;padding:32px clamp(20px,4vw,64px);max-width:1600px;width:100%;margin:auto;align-self:start}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:700}h1{margin:2px 0 0;font-size:27px;letter-spacing:-.6px}h2{font-size:18px;margin:0}p{margin:5px 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.lead{color:var(--muted);margin:8px 0 24px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}.stat{padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:155px;box-shadow:var(--shadow)}.stat strong{font-size:22px;font-weight:600;display:block;line-height:1.4}.stat span{color:var(--muted);font-size:11px}.distribution{height:5px;display:flex;border-radius:4px;overflow:hidden;margin-top:12px;gap:3px}.distribution i{background:var(--accent);min-width:4px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.tabs{display:flex;padding:4px;background:var(--line);border-radius:10px;gap:3px}.tab{border:0;background:transparent;padding:7px 16px}.tab.active{background:var(--panel);box-shadow:var(--shadow);color:var(--accent)}.searchbox{display:flex;gap:7px;flex:1;max-width:510px}.searchbox button{flex-shrink:0}.searchbox input{width:100%}.filters{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}.filters input{flex:1;min-width:130px}.filters select{max-width:180px}.requestbar{display:flex;gap:10px;padding:12px 0;flex-wrap:wrap}.requestbar select{flex:1}.notice{font-size:12px;color:var(--muted);padding:9px 0;min-height:32px}.error{color:#d36969}.content-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.content-layout.inspecting{grid-template-columns:minmax(0,1fr) minmax(300px,40%)}.stream{min-width:0}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin:0 0 13px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.card-head .meta{color:var(--muted);font-size:11px;word-break:break-word}.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--accent);white-space:nowrap;margin-right:7px}.badge.raw{background:#eaf5ef;color:#4e896d}.badge.tool{background:#f4eddf;color:#947631}.badge.assistant{background:#edeaf9;color:#8063bb}.card-body{padding:17px 19px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.85}.card.summary .card-body{border-left:3px solid var(--accent);margin:12px 0}.card-foot{display:flex;gap:8px;padding:0 18px 13px;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.card-foot button{font-size:11px;padding:4px 10px}details{padding:9px 18px;border-top:1px solid var(--line)}summary{cursor:pointer;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,monospace}.media-img{display:block;max-width:100%;max-height:340px;border-radius:8px;margin:12px 0}.media-button{font-size:11px;margin:8px 0}.empty{border:1px dashed var(--line);border-radius:14px;text-align:center;padding:70px 25px;color:var(--muted);background:var(--panel)}.empty .icon{font-size:28px;color:var(--accent);margin-bottom:14px}.empty h2{color:var(--ink);margin-bottom:6px}.inspector{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:19px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;align-self:start}.inspector-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.breadcrumb{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 15px}.breadcrumb button{font-size:11px;padding:3px 7px}.source-label{margin:17px 0 10px;color:var(--muted);font-size:11px;font-weight:650}.inspector .card{box-shadow:none}.inspector .card-body{font-size:13px}.inspector .card-head{padding:10px}.inspector .card-foot{padding:0 10px 10px}.pagination{display:flex;justify-content:center;gap:12px;margin:25px 0}.pagination button{color:var(--accent)}.job{font-size:12px;display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}mark{background:#ffdb7580;color:inherit;border-radius:3px;padding:0 1px}.mobile-nav{display:none}.call-label{color:var(--muted);font-size:11px;padding:0 0 12px}
@media(max-width:1150px){.content-layout.inspecting{grid-template-columns:minmax(0,1fr)}.inspector{position:fixed;z-index:5;top:14px;right:14px;bottom:14px;width:min(520px,calc(100vw - 28px));max-height:none;box-shadow:0 0 0 100vmax #0005}.stats .stat{min-width:130px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:7;top:0;bottom:0;width:265px;box-shadow:0 0 0 100vmax #0006}.sidebar.open{display:block}.mobile-nav{display:block}main{min-width:0;padding:20px 16px}h1{font-size:22px}.top{align-items:flex-start}.stats{gap:8px}.stat{flex:1;padding:12px;min-width:95px!important}.stat strong{font-size:20px}.tabs{width:100%}.tab{flex:1;padding:6px 9px}.searchbox{max-width:none;width:100%}.filters input{min-width:100%}.card-body{padding:13px}.top-actions button{padding:6px 9px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">∞</span>LCM <span class="sub">ARCHIVE</span></div><p class="sub">上下文有层次，历史有出处。</p><div class="section-label">会话 / SESSIONS</div><div id="sessions"></div><div class="sidebar-bottom">原文持续留存<br>各级摘要可逐层追溯<br><span id="budget"></span></div><button id="close-nav" class="mobile-nav">收起会话</button></aside>
<main>
<header class="top"><div><div class="eyebrow">CONTEXT EXPLORER</div><h1>上下文与历史</h1></div><div class="top-actions"><button class="mobile-nav" id="nav">会话</button><button id="theme" aria-label="切换明暗主题">◐</button><button id="refresh">刷新</button><button id="reset-context" disabled>重置 Context</button></div></header>
<p class="lead" id="session-name">选择一个会话，查看它如何被记住。</p>
<div class="stats"><div class="stat"><strong id="token-count">—</strong><span>当前历史 tokens · 估算</span><div class="distribution" id="distribution"></div></div><div class="stat"><strong id="raw-count">—</strong><span>永久存档 · 原始记录</span></div><div class="stat"><strong id="version">—</strong><span>当前发布版本</span></div><div class="stat"><strong id="layers">—</strong><span>压缩层数</span></div></div>
<div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" data-mode="context" role="tab">当前上下文</button><button class="tab" data-mode="history" role="tab">完整历史</button><button class="tab" data-mode="request" role="tab">实际请求</button></div><form class="searchbox" id="search-form"><input id="query" aria-label="搜索内容" placeholder="搜索这个会话…"><button type="submit">搜索</button><button type="button" id="filter-toggle" aria-label="展开筛选">筛选</button></form></div>
<div id="filters" class="filters" hidden><input id="sender" placeholder="发送者 ID / 昵称" aria-label="发送者"><input id="start" type="datetime-local" aria-label="开始时间"><input id="end" type="datetime-local" aria-label="结束时间"><select id="target" aria-label="搜索范围"><option value="both">原文与摘要</option><option value="raw">只搜原文</option><option value="summaries">只搜摘要</option></select><input id="level" type="number" min="0" placeholder="层级（可选）" aria-label="压缩层级"></div>
<div class="requestbar" id="requestbar" hidden><select id="run" aria-label="选择回复轮次"></select><select id="step" aria-label="选择模型调用"></select></div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="content-layout" id="layout"><section class="stream" id="stream"></section><aside class="inspector" id="inspector" hidden><div class="inspector-head"><h2>来源追溯</h2><button id="close-inspector" aria-label="关闭来源">×</button></div><div class="sub">展开只改变阅读范围，原文不会加入模型输入。</div><div class="breadcrumb" id="breadcrumbs"></div><div id="source"></div></aside></div>
<div class="pagination"><button id="back" hidden>返回搜索结果</button><button id="more" hidden>加载更多</button></div>
<details id="jobs-panel"><summary>后台压缩状态</summary><div id="jobs"></div></details>
</main>
</div>
<script src="viewer.js"></script>
</body></html>
